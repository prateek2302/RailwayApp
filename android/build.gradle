buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    def configureReact = { p ->
        if (p.extensions.findByName("react")) {
            p.react {
                if (System.getProperty("os.name").toLowerCase().contains("mac")) {
                    def nodePath = "/usr/local/bin/node"
                    if (new File("/opt/homebrew/bin/node").exists()) {
                        nodePath = "/opt/homebrew/bin/node"
                    }
                    if (new File(nodePath).exists()) {
                        nodeExecutableAndArgs = [nodePath]
                    }
                }
            }
        }
    }

    if (project.state.executed) {
        configureReact(project)
    } else {
        project.afterEvaluate { configureReact(it) }
    }
}
